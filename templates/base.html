<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FocusFlow{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6fb;
            color: #172033;
        }
        nav {
            background: #172033;
            color: white;
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a { color: white; text-decoration: none; margin-left: 18px; }
        .brand { font-size: 1.3rem; font-weight: 800; }
        .container { max-width: 1050px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 22px; }
        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(20, 30, 50, .08);
            margin-bottom: 22px;
        }
        h1, h2 { margin-top: 0; }
        .timer {
            text-align: center;
            padding: 30px 15px;
        }
        #display { font-size: 5.5rem; font-weight: 800; letter-spacing: 2px; margin: 12px 0; }
        .mode { font-weight: 700; color: #596579; }
        button, .button {
            border: 0; border-radius: 10px; padding: 11px 16px;
            cursor: pointer; font-weight: 700; text-decoration: none;
            display: inline-block;
        }
        .primary { background: #3157d5; color: white; }
        .secondary { background: #e8ecf7; color: #172033; }
        .danger { background: #e85b5b; color: white; }
        .controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .task-form { display: grid; grid-template-columns: 1fr 130px auto; gap: 8px; }
        input, select {
            width: 100%; padding: 12px; border: 1px solid #d8deea;
            border-radius: 10px; font-size: 1rem;
        }
        .task {
            display: flex; align-items: center; gap: 10px; padding: 12px 0;
            border-bottom: 1px solid #edf0f5;
        }
        .task:last-child { border-bottom: 0; }
        .task-title { flex: 1; }
        .done { text-decoration: line-through; color: #8992a3; }
        .pill {
            background: #edf1ff; color: #3157d5; border-radius: 999px;
            padding: 4px 8px; font-size: .78rem; font-weight: 700;
        }
        .stats { display: flex; gap: 12px; }
        .stat { flex: 1; background: #f7f8fc; padding: 14px; border-radius: 12px; text-align: center; }
        .stat strong { display: block; font-size: 1.5rem; }
        .flash { padding: 12px 16px; border-radius: 10px; margin-bottom: 14px; background: #e8f6ed; }
        .flash.error { background: #fdeaea; }
        .auth { max-width: 460px; margin: 70px auto; }
        .auth button { width: 100%; margin-top: 10px; }
        .small { color: #697386; font-size: .9rem; }
        .history { font-size: .9rem; }
        @media (max-width: 800px) {
            .grid { grid-template-columns: 1fr; }
            #display { font-size: 4rem; }
            .task-form { grid-template-columns: 1fr; }
            nav { padding: 14px 20px; }
        }
    </style>
</head>
<body>
<nav>
    <a class="brand" href="{{ url_for('dashboard') }}">FocusFlow</a>
    {% if session.get("user_id") %}
        <div>
            <span class="small" style="color:#dce2f2;">{{ session.get("email") }}</span>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    {% endif %}
</nav>

<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ 'error' if category == 'error' else '' }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
