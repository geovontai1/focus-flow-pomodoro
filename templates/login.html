{% extends "base.html" %}
{% block title %}Login — FocusFlow{% endblock %}
{% block content %}
<div class="card auth">
    <h1>Welcome back</h1>
    <p class="small">Log in to access your Pomodoro timer, tasks, and study history.</p>
    <form method="post">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="email">
        <br><br>
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password">
        <button class="primary" type="submit">Log in</button>
    </form>
    <p class="small" style="margin-top:18px;">No account? <a href="{{ url_for('register') }}">Create one</a></p>
</div>
{% endblock %}
